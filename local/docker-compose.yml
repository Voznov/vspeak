name: vspeak-local

services:
  postgres:
    image: postgres:16
    restart: always
    container_name: vspeak_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vspeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vspeak}
      POSTGRES_DB: ${POSTGRES_DB:-vspeak}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vspeak} -d ${POSTGRES_DB:-vspeak}']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    container_name: vspeak_minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-vspeak}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-vspeak_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: vspeak_local_network
