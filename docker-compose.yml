services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/voznov/vspeak-server:latest
    expose:
      - "3000"
    ports:
      - "${MEDIASOUP_MIN_PORT}-${MEDIASOUP_MAX_PORT}:${MEDIASOUP_MIN_PORT}-${MEDIASOUP_MAX_PORT}/udp"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_KEY: ${ADMIN_KEY}

      HTTP_PORT: 3000
      HTTP_HOST: 0.0.0.0

      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${SERVER_DOMAIN_NAME}
      MEDIASOUP_MIN_PORT: ${MEDIASOUP_MIN_PORT}
      MEDIASOUP_MAX_PORT: ${MEDIASOUP_MAX_PORT}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-client:
    image: ghcr.io/voznov/vspeak-web-client:latest
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx:/etc/nginx
      - ${NGINX_SSL_CERTIFICATE_PATH}:/etc/nginx/ssl/fullchain.pem:ro
      - ${NGINX_SSL_CERTIFICATE_KEY_PATH}:/etc/nginx/ssl/privkey.pem:ro
    environment:
      SERVER_DOMAIN_NAME: ${SERVER_DOMAIN_NAME}
      HTTPS_PORT: ${HTTPS_PORT}
    command: >-
      sh -c "envsubst '$$SERVER_DOMAIN_NAME $$HTTPS_PORT'
      < /etc/nginx/nginx.conf.template
      > /etc/nginx/nginx.conf
      && exec nginx -g 'daemon off;'"
    depends_on:
      - server
      - web-client
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
