events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    upstream server {
        server server:3000;
    }

    upstream web-client {
        server web-client:80;
    }

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP server (for local dev or redirect to HTTPS in production)
    server {
        listen 80;
        server_name _;

        # For production: uncomment to redirect HTTP -> HTTPS
        # return 301 https://$host$request_uri;

        # Common locations (defined in nginx-locations.conf)
        include /etc/nginx/locations.conf;
    }

    # HTTPS server (uncomment and configure for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # SSL certificates (SSL termination: HTTPS -> HTTP to backend)
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     # Common locations (defined in nginx-locations.conf)
    #     include /etc/nginx/locations.conf;
    # }
}
