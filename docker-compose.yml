services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    container_name: vspeak_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/voznov/vspeak-server:latest
    expose:
      - "3000"
    ports:
      - "40000-40999:40000-40999/udp"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # JWT secret
      # Generate with: openssl rand -base64 32
      JWT_SECRET: your-secret-key-change-me

      # Admin key to admin users
      # Generate with: openssl rand -base64 32
      ADMIN_KEY: your-admin-key-change-me

      # HTTP server configuration
      HTTP_PORT: 3000
      HTTP_HOST: 0.0.0.0

      # mediasoup RTC configuration
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: 127.0.0.1

      # mediasoup RTC port range (default: 40000-40999)
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40999

      # PostgreSQL connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-client:
    image: ghcr.io/voznov/vspeak-web-client:latest
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx:/etc/nginx:ro
    depends_on:
      - server
      - web-client
    restart: unless-stopped

volumes:
  postgres_data:
