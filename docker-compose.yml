services:
  server:
    image: ghcr.io/voznov/vspeak-server:latest
    expose:
      - "3000"
    ports:
      - "40000-40999:40000-40999/udp"
    environment:
      # JWT secret
      # Generate with: openssl rand -base64 32
      JWT_SECRET: your-secret-key-change-me

      # Admin key to admin users
      # Generate with: openssl rand -base64 32
      ADMIN_KEY: your-admin-key-change-me

      # HTTP server configuration
      HTTP_PORT: 3000
      HTTP_HOST: 0.0.0.0

      # mediasoup RTC configuration
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: 127.0.0.1

      # mediasoup RTC port range (default: 40000-40999)
      MEDIASOUP_MIN_PORT: 40000
      MEDIASOUP_MAX_PORT: 40999
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-client:
    image: ghcr.io/voznov/vspeak-web-client:latest
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx:/etc/nginx:ro
    depends_on:
      - server
      - web-client
    restart: unless-stopped
